name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ github.ref }}" -ne "refs/heads/main") {
              throw "Manual package publishing must run from main."
            }
            $mainSha = (git rev-parse origin/main).Trim()
            if ($env:GITHUB_SHA -ne $mainSha) {
              throw "Manual package publishing must run from the exact current main commit."
            }
          }
          else {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Tagged commit '$env:GITHUB_SHA' is not contained in current main history."
            }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release version
        shell: pwsh
        run: |
          $version = [string]([xml](Get-Content "Directory.Build.props")).Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Missing package version in Directory.Build.props."
          }
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            $expected = "v" + $version
            if ($tag -ne $expected) {
              throw "Tag '$tag' does not match package version '$expected'."
            }
          }
          else {
            Write-Host "Manual publish of Flamoris.Mcp.Core $version from current main."
          }

      - name: Restore
        run: dotnet restore Flamoris.Mcp.slnx

      - name: Build
        run: dotnet build Flamoris.Mcp.slnx --configuration Release --no-restore

      - name: Publish self-contained bridge
        run: dotnet publish src/Flamoris.Mcp.Bridge --configuration Release --runtime win-x64 --self-contained true --output artifacts/bridge

      - name: Test through published bridge
        shell: pwsh
        run: |
          $env:FLAMORIS_TEST_BRIDGE = Join-Path $PWD 'artifacts/bridge/Flamoris.Mcp.Bridge.exe'
          dotnet test tests/Flamoris.Mcp.Tests --configuration Release --no-build --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deterministic build and PackageReference smoke
        shell: pwsh
        run: ./scripts/package-smoke.ps1

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: akino-nanto

      - name: Publish to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          $version = [string]([xml](Get-Content "Directory.Build.props")).Project.PropertyGroup.Version
          $ids = @('Flamoris.Mcp.Core', 'Flamoris.Mcp.Wpf')
          $indexBase = 'https://api.nuget.org/v3-flatcontainer'

          function Test-NuGetVersion([string]$id, [string]$version) {
            $indexUrl = "$indexBase/$($id.ToLowerInvariant())/index.json"
            try {
              $index = Invoke-RestMethod -Uri $indexUrl -TimeoutSec 20
              return $index.versions -contains $version
            }
            catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -eq 404) { return $false }
              throw "Could not verify $id $version on nuget.org: $($_.Exception.Message)"
            }
          }

          foreach ($id in $ids) {
            if (Test-NuGetVersion $id $version) {
              Write-Host "$id $version is already published; skipping immutable package."
              continue
            }

            $package = Get-Item "artifacts/packages/$id.$version.nupkg"
            dotnet nuget push $package.FullName `
              --source "https://api.nuget.org/v3/index.json" `
              --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) {
              # A timeout may occur after nuget.org accepted the immutable package.
              # Continue only if the exact ID/version is now visible.
              if (-not (Test-NuGetVersion $id $version)) {
                throw "Failed to publish $id $version."
              }
              Write-Host "$id $version is visible after push returned an error."
            }
          }

          # nuget.org indexing can lag behind a successful push. Verify both packages
          # and fail the workflow if either immutable release is still unavailable.
          $deadline = (Get-Date).AddMinutes(3)
          do {
            $missing = @($ids | Where-Object { -not (Test-NuGetVersion $_ $version) })
            if ($missing.Count -eq 0) { break }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)

          if ($missing.Count -gt 0) {
            throw "Release incomplete; not visible on nuget.org: $($missing -join ', ') $version"
          }
          Write-Host "Verified both NuGet packages at version $version."
