name: MCP Core foundation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore released packages
        run: dotnet restore Flamoris.Mcp.slnx
      - name: Build
        run: dotnet build Flamoris.Mcp.slnx -c Release --no-restore
      - name: Publish self-contained bridge
        run: dotnet publish src/Flamoris.Mcp.Bridge -c Release -r win-x64 --self-contained true -o artifacts/bridge
      - name: Test through published bridge with official client
        shell: pwsh
        run: |
          $env:FLAMORIS_TEST_BRIDGE = Join-Path $PWD 'artifacts/bridge/Flamoris.Mcp.Bridge.exe'
          dotnet test tests/Flamoris.Mcp.Tests -c Release --no-build --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deterministic library and PackageReference smoke
        shell: pwsh
        run: ./scripts/package-smoke.ps1
